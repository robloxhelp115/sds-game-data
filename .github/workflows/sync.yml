name: Sync Game Data to Sheets & Fandom

on:
  push:
    branches:
      - main
    paths:
      - 'data/raw_payload.json'
  workflow_dispatch:

concurrency:
  group: sync-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas mwclient requests gspread google-auth

      - name: Process Payload & Update Wiki and Sheets
        env:
          # FANDOM_USER: ${{ secrets.FANDOM_BOT_USERNAME }}
          # FANDOM_PASS: ${{ secrets.FANDOM_BOT_PASSWORD }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
        run: python scripts/process_data.py

      - name: Commit and Push Updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add csv/ version.txt
          git commit -m "Automated sync: Updated CSV tables and version.txt [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
