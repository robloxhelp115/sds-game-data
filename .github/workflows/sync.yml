name: Sync Game Data to Sheets & Fandom

on:
  push:
    paths:
      - 'data/raw_payload.json'
  workflow_dispatch: # Allows manual runs via the GitHub UI

concurrency:
  group: sync-pipeline
  cancel-in-progress: false

permissions:
  contents: write # Grants the workflow permission to commit and push changes

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas mwclient requests

      - name: Run Data Processing & Fandom Sync Script
        env:
          FANDOM_USER: ${{ secrets.FANDOM_BOT_USERNAME }}
          FANDOM_PASS: ${{ secrets.FANDOM_BOT_PASSWORD }}
        run: python scripts/process_data.py

      - name: Commit and Push Updated CSVs
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add csv/ version.txt
          git commit -m "Automated sync: Updated game data, CSVs, and version [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
