name: Sync Game Data to Sheets & Fandom

on:
  repository_dispatch:
    types: [roblox_data_sync]
  workflow_dispatch: # Allows manual runs via the GitHub UI for testing

jobs:
  process-and-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas mwclient requests

      - name: Run Data Processing & Fandom Sync Script
        env:
          FANDOM_USER: ${{ secrets.FANDOM_BOT_USERNAME }}
          FANDOM_PASS: ${{ secrets.FANDOM_BOT_PASSWORD }}
        run: python scripts/process_data.py

      - name: Commit and Push Updated CSVs
        run: |
          git config --global user.name "SDS-Sync-Bot"
          git config --global user.email "bot@users.noreply.github.com"
          git add csv/ version.txt data/
          git commit -m "Automated sync: Updated game data and CSVs" || echo "No changes to commit"
          git push
